<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>火柴人角色圣经 · 16 個全身pose</title>
<style>
body {font-family: "Microsoft YaHei", sans-serif; background:#F5F2EC; margin:20px; color:#1A1A1A;}
.grid {display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px;}
.card {background:#fff; border-radius:8px; padding:12px; box-shadow:0 2px 6px rgba(0,0,0,.1); text-align:center; 
      opacity:0; transform:scale(0.9); transition:opacity 0.5s ease, transform 0.5s ease;}
.card.active {opacity:1; transform:scale(1);}
.card svg {width:100%; height:auto; background:#FDFCF9; border-radius:6px;}
.label {font-size:12px; color:#666; margin-top:6px;}
</style>
</head>
<body>
<h1>火柴人角色圣经 · 16 個全身pose</h1>
<div class="grid" id="grid">
  <!-- 1. 平靜 -->
  <div class="card"><svg viewBox="0 0 240 320" stroke="#1A1A1A" stroke-width="7" fill="none"><circle cx="120" cy="58" r="34" fill="#FFFFFF"/><line x1="120" y1="96" x2="120" y2="172"/><line x1="120" y1="112" x2="80" y2="152"/><line x1="120" y1="112" x2="160" y2="152"/><line x1="120" y1="172" x2="98" y2="246"/><line x1="120" y1="172" x2="142" y2="246"/></svg><div class="label">平靜</div></div>
  <!-- 2. 说话 -->
  <div class="card"><svg viewBox="0 0 240 320" stroke="#1A1A1A" stroke-width="7" fill="none"><circle cx="120" cy="58" r="34" fill="#FFFFFF"/><line x1="120" y1="96" x2="120" y2="172"/><line x1="120" y1="112" x2="158" y2="92"/><line x1="120" y1="112" x2="92" y2="148"/><line x1="120" y1="172" x2="98" y2="246"/><line x1="120" y1="172" x2="142" y2="246"/></svg><div class="label">说话</div></div>
  <!-- 3. 抱头 -->
  <div class="card"><svg viewBox="0 0 240 320" stroke="#1A1A1A" stroke-width="7" fill="none"><circle cx="120" cy="58" r="34" fill="#FFFFFF"/><line x1="120" y1="96" x2="120" y2="172"/><polyline points="120,112 86,64 94,38"/><polyline points="120,112 154,64 146,38"/><line x1="120" y1="172" x2="98" y2="246"/><line x1="120" y1="172" x2="142" y2="246"/></svg><div class="label">抱头</div></div>
  <!-- 4. 指向 -->
  <div class="card"><svg viewBox="0 0 240 320" stroke="#1A1A1A" stroke-width="7" fill="none"><circle cx="120" cy="58" r="34" fill="#FFFFFF"/><line x1="120" y1="96" x2="120" y2="172"/><line x1="120" y1="112" x2="178" y2="104"/><line x1="120" y1="112" x2="92" y2="148"/><line x1="120" y1="172" x2="98" y2="246"/><line x1="120" y1="172" x2="142" y2="246"/></svg><div class="label">指向</div></div>
  <!-- 5. 叉腰 -->
  <div class="card"><svg viewBox="0 0 240 320" stroke="#1A1A1A" stroke-width="7" fill="none"><circle cx="120" cy="58" r="34" fill="#FFFFFF"/><line x1="120" y1="96" x2="120" y2="172"/><polyline points="120,112 84,118 96,168"/><polyline points="120,112 156,118 144,168"/><line x1="120" y1="172" x2="98" y2="246"/><line x1="120" y1="172" x2="142" y2="246"/></svg><div class="label">叉腰</div></div>
  <!-- 6. 走路 -->
  <div class="card"><svg viewBox="0 0 240 320" stroke="#1A1A1A" stroke-width="7" fill="none"><circle cx="120" cy="58" r="34" fill="#FFFFFF"/><line x1="120" y1="96" x2="120" y2="172"/><line x1="120" y1="112" x2="92" y2="144"/><line x1="120" y1="112" x2="150" y2="136"/><line x1="120" y1="172" x2="86" y2="238"/><line x1="120" y1="172" x2="152" y2="230"/></svg><div class="label">走路</div></div>
  <!-- 7. 坐姿思考 -->
  <div class="card"><svg viewBox="0 0 240 320" stroke="#1A1A1A" stroke-width="7" fill="none"><circle cx="120" cy="58" r="34" fill="#FFFFFF"/><line x1="120" y1="96" x2="120" y2="172"/><line x1="120" y1="112" x2="90" y2="144"/><line x1="120" y1="112" x2="150" y2="144"/><line x1="120" y1="172" x2="94" y2="246"/><line x1="120" y1="172" x2="140" y2="246"/></svg><div class="label">坐姿思考</div></div>
  <!-- 8. 捂脸 -->
  <div class="card"><svg viewBox="0 0 240 320" stroke="#1A1A1A" stroke-width="7" fill="none"><circle cx="120" cy="58" r="34" fill="#FFFFFF"/><line x1="120" y1="96" x2="120" y2="172"/><line x1="120" y1="112" x2="150" y2="84"/><line x1="120" y1="112" x2="136" y2="64"/><line x1="120" y1="172" x2="98" y2="246"/><line x1="120" y1="172" x2="142" y2="246"/></svg><div class="label">捂脸</div></div>
  <!-- 9. 点赞 -->
  <div class="card"><svg viewBox="0 0 240 320" stroke="#1A1A1A" stroke-width="7" fill="none"><circle cx="120" cy="58" r="34" fill="#FFFFFF"/><line x1="120" y1="96" x2="120" y2="172"/><line x1="120" y1="112" x2="160" y2="88"/><line x1="120" y1="172" x2="98" y2="246"/><line x1="120" y1="172" x2="142" y2="246"/><polygon points="166,78 170,70 174,78" fill="#1A1A1A"/></svg><div class="label">点赞</div></div>
  <!-- 10. 惊讶 -->
  <div class="card"><svg viewBox="0 0 240 320" stroke="#1A1A1A" stroke-width="7" fill="none"><circle cx="120" cy="58" r="34" fill="#FFFFFF"/><line x1="120" y1="96" x2="120" y2="172"/><line x1="120" y1="112" x2="120" y2="172"/><line x1="120" y1="112" x2="120" y2="172"/><line x1="120" y1="172" x2="98" y2="246"/><line x1="120" y1="172" x2="142" y2="246"/><circle cx="106" cy="54" r="7" fill="#1A1A1A"/><circle cx="134" cy="54" r="7" fill="#1A1A1A"/></svg><div class="label">惊讶</div></div>
  <!-- 12. 沮丧 -->
  <div class="card"><svg viewBox="0 0 240 320" stroke="#1A1A1A" stroke-width="7" fill="none"><circle cx="120" cy="58" r="34" fill="#FFFFFF"/><line x1="120" y1="96" x2="120" y2="172"/><line x1="120" y1="112" x2="120" y2="172"/><line x1="120" y1="112" x2="120" y2="172"/><line x1="120" y1="172" x2="98" y2="246"/><line x1="120" y1="172" x2="142" y2="246"/><line x1="100" y1="44" x2="140" y2="44"/></svg><div class="label">沮丧</div></div>
  <!-- 13. 坚定 -->
  <div class="card"><svg viewBox="0 0 240 320" stroke="#1A1A1A" stroke-width="7" fill="none"><circle cx="120" cy="58" r="34" fill="#FFFFFF"/><line x1="120" y1="96" x2="120" y2="172"/><line x1="120" y1="96" x2="120" y2="172"/><line x1="120" y1="96" x2="120" y2="172"/><line x1="120" y1="172" x2="98" y2="246"/><line x1="120" y1="172" x2="142" y2="246"/><line x1="105" y1="45" x2="135" y2="45"/></svg><div class="label">坚定</div></div>
  <!-- 14. 开心 -->
  <div class="card"><svg viewBox="0 0 240 320" stroke="#1A1A1A" stroke-width="7" fill="none"><circle cx="120" cy="58" r="34" fill="#FFFFFF"/><line x1="120" y1="96" x2="120" y2="172"/><line x1="120" y1="96" x2="120" y2="172"/><line x1="120" y1="96" x2="120" y2="172"/><line x1="120" y1="172" x2="98" y2="246"/><line x1="120" y1="172" x2="142" y2="246"/><path d="M110 72 Q120 77 130 72" fill="none" stroke="#1A1A1A" stroke-width="5"/></svg><div class="label">开心</div></div>
  <!-- 15. 摊手 -->
  <div class="card"><svg viewBox="0 0 240 320" stroke="#1A1A1A" stroke-width="7" fill="none"><circle cx="120" cy="58" r="34" fill="#FFFFFF"/><line x1="120" y1="96" x2="120" y2="172"/><polyline points="120,112 82,134 158,134"/><line x1="120" y1="172" x2="98" y2="246"/><line x1="120" y1="172" x2="142" y2="246"/></svg><div class="label">摊手</div></div>
  <!-- 16. 抱头 (另一角度) -->
  <div class="card"><svg viewBox="0 0 240 320" stroke="#1A1A1A" stroke-width="7" fill="none"><circle cx="120" cy="58" r="34" fill="#FFFFFF"/><line x1="120" y1="96" x2="120" y2="172"/><polyline points="120,112 86,64 94,38"/><polyline points="120,112 154,64 146,38"/><line x1="120" y1="172" x2="98" y2="246"/><line x1="120" y1="172" x2="142" y2="246"/></svg><div class="label">抱头</div></div>
  <!-- 17. 伸展 -->
  <div class="card"><svg viewBox="0 0 240 320" stroke="#1A1A1A" stroke-width="7" fill="none"><circle cx="120" cy="58" r="34" fill="#FFFFFF"/><line x1="120" y1="96" x2="120" y2="172"/><line x1="120" y1="112" x2="78" y2="130"/><line x1="120" y1="112" x2="162" y2="130"/><line x1="120" y1="172" x2="98" y2="246"/><line x1="120" y1="172" x2="142" y2="246"/></svg><div class="label">伸展</div></div>
</div>

<script>
const cards = document.querySelectorAll('.card');
let idx = 0;
function showCard(i) {
  cards.forEach((c, ci) => {
    c.classList.toggle('active', ci === i);
  });
}
function nextCard() {
  idx = (idx + 1) % cards.length;
  showCard(idx);
}
// 初始顯示第一張
showCard(idx);
// 每 1.5 秒切換一次
setInterval(nextCard, 1500);
// 為每個 SVG 加入 <title> 以符合無障礙性（LSP 提醒）
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.card svg').forEach((svg, i) => {
    const label = svg.parentElement.querySelector('.label');
    if (label) {
      const title = document.createElement('title');
      title.textContent = label.textContent.trim();
      svg.insertBefore(title, svg.firstChild);
    }
  });
});
</script>
</body>
</html>
