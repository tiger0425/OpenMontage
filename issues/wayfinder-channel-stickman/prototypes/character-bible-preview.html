<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>火柴人角色圣经 · 原型预览</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; background:#F5F2EC; margin:0; padding:32px; color:#1A1A1A; }
  h1 { font-size:22px; } h2 { font-size:17px; margin:36px 0 12px; border-left:5px solid #FF7A45; padding-left:10px;}
  .sub { color:#666; font-size:13px; }
  .grid { display:flex; flex-wrap:wrap; gap:14px; }
  .card { background:#fff; border-radius:10px; padding:10px 10px 6px; box-shadow:0 1px 4px rgba(0,0,0,.08); text-align:center; width:190px;}
  .card svg { background:#FDFCF9; border-radius:6px; }
  .card .name { font-size:14px; font-weight:bold; margin-top:6px;}
  .card .en { font-size:11px; color:#999; }
  .spec { display:flex; gap:14px; flex-wrap:wrap; }
  table { border-collapse:collapse; font-size:13px; margin-top:8px;}
  td,th { border:1px solid #ddd; padding:4px 10px; text-align:left;}
</style>
</head>
<body>
<h1>火柴人角色圣经 · 原型预览 <span class="sub">channel-stickman / 工单《SVG 火柴人角色圣经原型》</span></h1>

<h2>视觉规范</h2>
<div class="spec">
  <div class="card"><div id="ratio"></div><div class="name">头身比 ≈ 1 : 2.2（全身约 3 头身）</div><div class="en">大头亲和系，表情可读性优先</div></div>
  <div class="card">
    <svg width="170" height="90"><title>配色三件套</title><rect x="8" y="8" width="44" height="44" rx="8" fill="#1A1A1A"/><circle cx="88" cy="30" r="22" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5"/><circle cx="136" cy="30" r="14" fill="#FF7A45"/><text x="30" y="72" font-size="10" text-anchor="middle">线条#1A1A1A</text><text x="88" y="72" font-size="10" text-anchor="middle">头部白</text><text x="136" y="72" font-size="10" text-anchor="middle">思考橙</text></svg>
    <div class="name">配色三件套</div><div class="en">黑线条 / 白头 / 思考橙（道具·情绪符号）</div>
  </div>
  <div class="card"><table>
    <tr><th>参数</th><th>值</th></tr>
    <tr><td>画布</td><td>240 × 320</td></tr>
    <tr><td>线宽</td><td>7 px，round cap</td></tr>
    <tr><td>头半径</td><td>34 px</td></tr>
    <tr><td>部件</td><td>头/眼/眉/嘴/躯干/双臂/双腿</td></tr>
    <tr><td>关节枢轴</td><td>颈(120,96) 肩(120,112) 髋(120,172)</td></tr>
  </table><div class="name">数据规范</div><div class="en">全部姿势由 RIG 数据渲染，可直接接 GSAP</div></div>
</div>

<h2>表情库（7）</h2><div class="grid" id="faces"></div>
<h2>动作库（9）</h2><div class="grid" id="actions"></div>

<script>
const S = '#1A1A1A', W = 7;
const MOUTHS = {
  flat:   '<path d="M110 72 Q120 75 130 72" fill="none"/>',
  talk:   '<ellipse cx="120" cy="73" rx="4.5" ry="6.5" fill="#1A1A1A"/>',
  o:      '<circle cx="120" cy="74" r="5.5" fill="#1A1A1A"/>',
  frown:  '<path d="M110 77 Q120 69 130 77" fill="none"/>',
  smile:  '<path d="M109 70 Q120 79 131 70" fill="none"/>',
  firm:   '<path d="M111 73 L129 73" fill="none"/>',
  side:   '<path d="M116 74 Q124 76 130 73" fill="none" transform="translate(4,0)"/>'
};
function face(f){
  const eyeR = f.bigEyes ? 7 : 4.5, ex = f.eyeDX||0, ey = f.eyeDY||0;
  let s = `<circle cx="120" cy="58" r="34" fill="#FFF" stroke="${S}" stroke-width="${W}"/>`;
  const lid = f.lidY!==undefined ? `stroke-linecap="round"` : '';
  s += `<circle cx="${106+ex}" cy="${52+ey}" r="${eyeR}" fill="${S}"/><circle cx="${134+ex}" cy="${52+ey}" r="${eyeR}" fill="${S}"/>`;
  const bl=f.bl??0, br=f.br??0, bdy=f.bdy??0;
  s += `<line x1="99" y1="${40+bdy}" x2="113" y2="${40+bdy}" transform="rotate(${bl} 106 ${40+bdy})" stroke="${S}" stroke-width="5" stroke-linecap="round"/>`;
  s += `<line x1="127" y1="${40+bdy}" x2="141" y2="${40+bdy}" transform="rotate(${br} 134 ${40+bdy})" stroke="${S}" stroke-width="5" stroke-linecap="round"/>`;
  s += MOUTHS[f.mouth||'flat'];
  return s;
}
function limb(pts){ return `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${S}" stroke-width="${W}" stroke-linecap="round" stroke-linejoin="round"/>`; }
const PROPS = {
  chair: `<g stroke="${S}" stroke-width="5" stroke-linecap="round"><line x1="86" y1="196" x2="86" y2="250"/><line x1="146" y1="196" x2="146" y2="250"/><line x1="82" y1="222" x2="150" y2="222"/><line x1="86" y1="196" x2="86" y2="160"/></g>`,
  qmark: `<g transform="translate(176,30)" fill="#FF7A45"><text x="0" y="34" font-size="44" font-weight="bold" font-family="Arial">?</text></g>`,
  bulb: `<g transform="translate(168,20)" stroke="#FF7A45" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="12" cy="14" r="10"/><line x1="8" y1="27" x2="16" y2="27"/><line x1="9" y1="32" x2="15" y2="32"/></g>`
};
function draw(pose){
  const d = {
    armL:[[120,112],[80,152]], armR:[[120,112],[160,152]],
    legL:[[120,172],[98,246]], legR:[[120,172],[142,246]],
    head:{}, ...(pose||{})
  };
  const hr = d.head.rot||0, hx=d.head.dx||0, hy=d.head.dy||0;
  const sh = d.shift||[0,0];
  const T = pts => pts.map(p=>[p[0]+sh[0], p[1]+sh[1]]);
  let s = `<ellipse cx="122" cy="256" rx="48" ry="8" fill="#000" opacity=".06"/>`;
  (d.props||[]).forEach(n=>{ if(PROPS[n]) s+=PROPS[n]; });
  s += limb(T(d.legL))+limb(T(d.legR))+limb(T(d.armL))+limb(T(d.armR));
  s += `<g transform="translate(${hx+sh[0]},${hy+sh[1]}) rotate(${hr} 120 96)">`+face(d.face||{})+`</g>`;
  (d.hands||[]).forEach(h=>{ s+=`<circle cx="${h[0]+sh[0]}" cy="${h[1]+sh[1]}" r="${h[2]||9}" fill="${S}"/>`; });
  (d.extras||[]).forEach(l=>{ s+=limb(T(l)); });
  return `<svg width="180" height="240" viewBox="0 0 240 320">${s}</svg>`;
}
const FACES = [
  ['calm','平静',{face:{mouth:'flat'}}],
  ['talking','说话',{face:{mouth:'talk',br:-8}}],
  ['thinking','思考',{face:{mouth:'side',eyeDX:-3,eyeDY:-3,bl:-12},props:['qmark']}],
  ['surprised','惊讶',{face:{mouth:'o',bigEyes:true,bdy:-5}}],
  ['sad','沮丧',{face:{mouth:'frown',bl:16,br:-16,bdy:2,eyeDY:2}}],
  ['determined','坚定',{face:{mouth:'firm',bl:-18,br:18}}],
  ['happy','开心',{face:{mouth:'smile',bdy:-2}}]
];
const ACTIONS = [
  ['speak_gesture','说话手势',{face:{mouth:'talk'},armR:[[120,112],[158,92]],hands:[[166,88]]}],
  ['shrug','摊手',{face:{mouth:'flat',bdy:-4,br:-10,bl:10},armL:[[120,112],[82,134]],armR:[[120,112],[158,134]],hands:[[74,132],[166,132]]}],
  ['head_hold','抱头',{face:{mouth:'o',bigEyes:true},armL:[[120,112],[86,64],[94,38]],armR:[[120,112],[154,64],[146,38]]}],
  ['point','指向',{face:{mouth:'talk'},armR:[[120,112],[178,104]],armL:[[120,112],[92,148]],hands:[[186,103]]}],
  ['akimbo','叉腰',{face:{mouth:'firm',bl:-10,br:10},armL:[[120,112],[84,118],[96,168]],armR:[[120,112],[156,118],[144,168]]}],
  ['walking','走路',{face:{mouth:'flat'},legL:[[120,172],[86,238]],legR:[[120,172],[152,230]],armL:[[120,112],[92,144]],armR:[[120,112],[150,136]]}],
  ['sit_think','坐姿思考',{face:{mouth:'side',eyeDX:-3,eyeDY:-3,bl:-12},props:['chair'],shift:[0,30],legL:[[116,208],[94,246]],legR:[[130,208],[140,246]],armL:[[116,120],[90,144],[106,72]],armR:[[122,120],[150,144]],hands:[[104,66,7]]}],
  ['facepalm','捂脸',{face:{mouth:'frown',bl:14,br:-14,bdy:3},head:{dx:6,dy:8,rot:8},armR:[[120,112],[150,84],[136,64]],hands:[[132,60],]}],
  ['thumbs_up','点赞',{face:{mouth:'smile',bdy:-2},armR:[[120,112],[160,88]],hands:[[166,80,10]],extras:[[[166,72],[171,58]]]}]
];
function card(key,zh,p){ return `<div class="card">${draw(p)}<div class="name">${zh}</div><div class="en">${key}</div></div>`; }
document.getElementById('faces').innerHTML = FACES.map(f=>card(f[0],f[1],f[2])).join('');
document.getElementById('actions').innerHTML = ACTIONS.map(a=>card(a[0],a[1],a[2])).join('');

const ratioSVG = (()=> {
  const u=34, cx=40;
  let s=`<svg width="150" height="260" viewBox="0 0 150 260"><title>头身比示意</title>`;
  [0,1,2].forEach(i=>{ s+=`<circle cx="${cx}" cy="${34+i*u*1.02}" r="${u*0.5}" fill="none" stroke="#FF7A45" stroke-width="2" stroke-dasharray="4 3"/>`; });
  s+=`<g transform="scale(0.62) translate(52,14)">`+draw({})+`</g></svg>`;
  return s;
})();
document.getElementById('ratio').innerHTML = ratioSVG;
</script>
</body>
</html>
