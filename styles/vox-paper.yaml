identity:
  name: vox-paper
  category: motion-graphics
  mood: "editorial, archival, tactile"
  pace: moderate
  best_for: "VOX-style paper-collage explainers and documentary segments built from real objects, real photographs and a hand-made feel."

visual_language:
  color_palette:
    primary:
      - "#1F3A5F"
    accent:
      - "#C8553D"
    background: "#F4EFE6"
    text: "#1C1917"
    muted: "#6B6257"
  composition: "Three layers of depth in every scene: a paper background field, one hero object, foreground scraps. One light source, one idea per frame, generous negative space, asymmetric editorial grid."
  texture: "Real paper grain, letterpress ink, torn edges, tape and pin marks. No procedural noise, no glossy 3D, no neon."

typography:
  headings:
    font: "Noto Serif CJK SC"
    weight: 700
    tracking: "-0.01em"
    line_height: 1.1
  body:
    font: "Noto Sans CJK SC"
    weight: 400
    tracking: "0"
    line_height: 1.5
  code:
    font: "Noto Sans Mono"
    weight: 400
  cjk:
    font: "Noto Serif CJK SC"
    note: "标题用思源宋体，正文用思源黑体。禁止等宽字幕、点分隔符、装饰编号。"
    baseline: 0.88
  scale_system: major_third
  weight_matrix:
    title: 700
    heading: 700
    body: 400
    caption: 500

motion:
  transitions:
    - cut
    - paper_slide
    - mask_reveal
  animation_style: "Paper stops moving when it lands. Entrances are short and decisive; no floaty easing, no endless drift. Camera moves never stop halfway."
  pacing_rules:
    min_scene_hold_seconds: 2.0
    max_scene_hold_seconds: 8.0
    simple_beat_seconds: "3-5"
    standard_beat_seconds: "5-8"
    complex_beat_seconds: "8-10"
    max_beat_seconds: "10"
    total_tolerance_percent: 10
    text_card_hold_seconds: 3.5
    stat_card_hold_seconds: 4.0
    transition_duration_seconds: 0.35
  entrance: "slide or drop onto the paper field, settle within 0.35s"
  exit: "cut or quick mask wipe, never a long fade"

audio:
  voice_style: "warm, measured, documentary narration"
  music_mood: "sparse archival score, low strings, paper rustle"
  music_volume: 0.12
  sfx_style: "paper slide, tape press, stamp thud, pin click"
  ducking_threshold_db: -18
  voice_variation_allowed: true
  hero_moment_voice_shift: "slower, lower, one beat of silence before the reveal"
  transition_voice_shift: "brief pause, then resume with a touch more energy"

asset_generation:
  image_prompt_prefix: "editorial paper-collage still, real photographic texture, soft single-source light, muted archival palette, plain background"
  image_negative_prompt: "flat vector icon, glossy 3D render, neon gradient, generic corporate illustration, text, watermark, extra fingers"
  diagram_style: "paper cut-out diagram with real printed labels, tape and pins"
  consistency_anchors:
    - "same warm paper field (#F4EFE6)"
    - "same single light source from the left"
    - "same torn-edge and tape vocabulary"
    - "real photos and real objects only; no icon substitutes"
  scene_type: paper_collage
  multi_image_per_scene: true
  images_per_scene: 3
  image_variation_guidance: "vary the hero object's angle and crop slightly; keep the paper field and light identical so the crossfade reads as camera movement."
  default_particles: dust
  default_particle_color: "#D9C9A3"
  default_vignette: true

quality_rules:
  - "Use only two fonts: Noto Serif CJK SC for titles and Noto Sans CJK SC for text. Any other font is an error."
  - "Never use monospaced captions, dot separators or decorative reference codes. Titles are five words or fewer."
  - "Three layers of depth in every scene; one light source; one idea per frame."
  - "Camera moves never stop halfway. No idle drift."
  - "Real objects and real photos only. Never substitute a flat icon or a generic panel for a number."
  - "No procedural textures. Reuse real paper, wood, brass and archive imagery with logged licences."
  - "Text must be at least 4.5% of frame height (49 px at 1080p)."

chart_palette:
  - "#1F3A5F"
  - "#C8553D"
  - "#7A8B6F"
  - "#D9A441"
  - "#6B6257"
  - "#2E6F73"

color_rules:
  harmony_type: split-complementary
  contrast_validation: true
  colorblind_safe: true

taste_profile:
  design_read: "A patient, tactile editorial film: paper, ink, real photographs and a single warm light. It should feel assembled by a person, not generated by a model."
  visual_variance: 6
  motion_intensity: 4
  information_density: 4
  palette_discipline: "Warm paper field + one ink blue + one brick accent. No fourth hue."
  layout_variation: "Alternate full-bleed photo, object-on-paper, and text-as-object compositions."
  reference_strategy: "Study Vox, Johnny Harris, Magnates Media and Lemmino frame by frame; copy composition and light, not surface style."
  anti_patterns:
    - "flat vector icons standing in for real objects"
    - "monospaced captions and dot separators"
    - "procedural noise textures"
    - "endless floaty camera drift"
    - "text cards with no object anchor"
  quality_gates:
    - "every scene has three depth layers"
    - "every number sits on a real object"
    - "no scene uses a banned font"
    - "every camera move completes"
