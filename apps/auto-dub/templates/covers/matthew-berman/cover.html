<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"视频标题"},
  {"id":"channel","type":"string","label":"Channel","default":""},
  {"id":"thumb_path","type":"string","label":"Thumbnail","default":""},
  {"id":"author_name","type":"string","label":"AuthorName","default":""},
  {"id":"author_title","type":"string","label":"AuthorTitle","default":""},
  {"id":"author_badges","type":"array","label":"AuthorBadges","default":[]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Bilibili Premium Cover</title>
    <style>
      /* 引入项目内共享资料库的顶级字体，确保渲染字体与大V原图 100% 像素吻合 */
      @font-face {
        font-family: 'NotoSansSC';
        src: url('/e:/YifuAIForge/OpenMontage/assets/shared_library/fonts/NotoSansSC-Black.ttf') format('truetype');
        font-weight: 900;
      }
      @font-face {
        font-family: 'Oswald';
        src: url('/e:/YifuAIForge/OpenMontage/assets/shared_library/fonts/Oswald-Bold.ttf') format('truetype');
        font-weight: 700;
      }
      @font-face {
        font-family: 'IBMPlexMono';
        src: url('/e:/YifuAIForge/OpenMontage/assets/shared_library/fonts/IBM-Plex-Mono.ttf') format('truetype');
      }

      body {
        margin: 0;
        font-family: 'NotoSansSC', system-ui, -apple-system, sans-serif;
        background-color: #04030a;
        overflow: hidden;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(circle at 40% 50%, #17113c 0%, #080617 70%, #030208 100%);
      }

      /* 右侧：本视频原封面（来自 thumb.jpg） */
      .video-panel {
        position: absolute;
        top: 115px;
        right: 288px;
        width: 480px;
        height: 850px;
        border: 2px solid rgba(102, 139, 255, 0.55);
        border-radius: 28px;
        background: #06050f;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
        overflow: hidden;
        z-index: 2;
      }
      .video-panel img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .video-panel .panel-label {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 14px 20px;
        background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.85) 100%);
        color: #ffffff;
        font-family: 'NotoSansSC', sans-serif;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 1px;
      }

      /* 左侧内容区：对齐 4:3 安全区 (left = 80px) */
      .content {
        position: absolute;
        top: 115px;
        left: 320px;
        bottom: 115px;
        width: 820px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        z-index: 10;
      }

      /* 头部标签行 */
      .header-row {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 24px;
      }

      /* 橙色集数标签 */
      .episode-badge {
        background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
        border: 2px solid #ffffff;
        border-radius: 16px;
        padding: 6px 20px;
        color: #ffffff;
        font-size: 24px;
        font-weight: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        box-shadow: 0 4px 15px rgba(234, 88, 12, 0.4);
      }
      .episode-badge span {
        font-family: 'Oswald', sans-serif;
        font-size: 28px;
        line-height: 1;
      }

      /* 大V身份卡 */
      .author-card {
        background: #070514;
        border: 2px solid #2b2075;
        border-radius: 12px;
        padding: 6px 24px;
        color: #ffffff;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 1px;
      }

      /* 背书勋章小标签 */
      .badges-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 50px;
      }
      .badge-pill {
        background: #08061a;
        border: 1px solid #281e69;
        border-radius: 10px;
        padding: 6px 18px;
        color: #9cb8ff;
        font-size: 18px;
        font-weight: 900;
      }

      /* 主标题上方的高亮药丸 */
      .promo-pill {
        background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
        color: #ffffff;
        font-size: 20px;
        font-weight: 900;
        padding: 6px 20px;
        border-radius: 12px;
        width: fit-content;
        margin-bottom: 24px;
        box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3);
      }

      /* 核心主标题：思源黑体，带高对比度黑色轮廓 */
      .title-container {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .title-line {
        font-size: 80px;
        font-weight: 900;
        line-height: 1.15;
        color: #ffffff;
        margin: 0;
        filter: drop-shadow(0 6px 15px rgba(0,0,0,0.95));
        -webkit-text-stroke: 4px #000000;
        paint-order: stroke fill;
      }

      /* 渐变金色主标题行 */
      .gold-text {
        background: linear-gradient(to bottom, #ffe600 20%, #ff8800 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* 底部金句 */
      .footer-quote {
        margin-top: auto;
        color: #facc15;
        font-size: 20px;
        font-weight: 900;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .footer-quote::before {
        content: "💬";
      }

      /* 底部亮黄色线条 */
      .bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 8px;
        background-color: #ffd700;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="cover" data-no-timeline data-width="1920" data-height="1080" data-start="0" data-duration="0.1">
      
      <!-- 右侧：本视频原封面 -->
      <div class="video-panel" id="video-panel">
        <img id="thumb-img" alt="原视频封面" />
        <div class="panel-label" id="panel-label"></div>
      </div>

      <!-- 左侧内容区 -->
      <div class="content">
        
        <!-- 第一行：频道卡 -->
        <div class="header-row">
          <div class="author-card" id="author-info">
            频道
          </div>
        </div>

        <!-- 第二行：药丸标签组 -->
        <div class="badges-row" id="badges-container">
          <!-- 动态载入标签 -->
        </div>

        <!-- 第三行：上方推荐胶囊 -->
        <div class="promo-pill" id="promo-tag">
          中文配音 · 免费观看
        </div>

        <!-- 第四行：主标题大字区 -->
        <div class="title-container" id="title-lines">
          <!-- 动态加载标题行 -->
        </div>

        <!-- 底部金句 -->
        <div class="footer-quote" id="footer-text">
          中文AI配音 · 一键追番
        </div>

      </div>

      <!-- 底部金色饰条 -->
      <div class="bottom-bar"></div>

    </div>

    <script>
      // 1. 获取动态编译变量
      const v = window.__hyperframes.getVariables();

      // 2. 渲染右侧原视频封面
      const thumbImg = document.getElementById("thumb-img");
      if (v.thumb_path) {
        thumbImg.src = v.thumb_path;
      }
      const panelLabel = document.getElementById("panel-label");
      if (v.channel) {
        panelLabel.textContent = `本视频 · ${v.channel}`;
      }

      // 3. 渲染大V卡片与勋章
      if (v.author_name && v.author_title) {
        document.getElementById("author-info").textContent = `${v.author_title} | ${v.author_name}`;
      } else if (v.channel) {
        document.getElementById("author-info").textContent = `频道 · ${v.channel}`;
      }
      
      const badgesContainer = document.getElementById("badges-container");
      badgesContainer.innerHTML = "";
      const badgesToUse = (v.author_badges && v.author_badges.length > 0) ? v.author_badges : [];
      
      badgesToUse.forEach(badgeText => {
        const pill = document.createElement("span");
        pill.className = "badge-pill";
        pill.textContent = badgeText;
        badgesContainer.appendChild(pill);
      });

      // 5. 动态标题智能切分与渲染
      const titleLinesContainer = document.getElementById("title-lines");
      titleLinesContainer.innerHTML = "";

      let rawTitle = v.title || "视频标题";
      let lines = [];
      
      if (rawTitle.includes("brings")) {
        lines = [
          "skills 1.2 重磅更新！",
          "/wait-what 与 /writing-for-agents",
          "集体登场"
        ];
        document.getElementById("promo-tag").textContent = "v1.2 震撼发布 · 生产力工具大拉满";
      } else if (rawTitle.toLowerCase().includes("wayfinder")) {
        lines = [
          "Wayfinder 全新解锁！",
          "AI 自动大项目规划",
          "硬核实操演示"
        ];
        document.getElementById("promo-tag").textContent = "智能体大项目编排 · 生产力工具";
      } else {
        lines = rawTitle.split("\n");
      }

      lines.forEach((lineText, idx) => {
        const h1 = document.createElement("h1");
        h1.className = "title-line";
        h1.textContent = lineText;
        
        if (idx > 0 || lineText.startsWith("/")) {
          h1.classList.add("gold-text");
        }
        titleLinesContainer.appendChild(h1);
      });
    </script>
  </body>
</html>
