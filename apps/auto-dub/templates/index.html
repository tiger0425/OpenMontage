<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"duration","type":"number","label":"Duration","default":3},
  {"id":"thanks","type":"string","label":"Thanks text","default":"感谢观看"},
  {"id":"cta","type":"string","label":"CTA text","default":"觉得有用，欢迎点赞 · 收藏 · 关注"},
  {"id":"channel_name","type":"string","label":"Channel name","default":""}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Bilibili 一键三连片尾</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <style>
      body {
        margin: 0;
        background: #08050a;
        color: #ffffff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .thanks {
        font-size: 96px;
        font-weight: 700;
        margin-bottom: 60px;
        text-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
      }
      .icons {
        display: flex;
        gap: 160px;
        align-items: center;
        justify-content: center;
        margin-bottom: 50px;
      }
      .icon-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }
      .icon-circle {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(255, 255, 255, 0.2);
        display: grid;
        place-items: center;
      }
      .icon-circle svg {
        width: 72px;
        height: 72px;
        fill: #ffffff;
      }
      .icon-label {
        font-size: 36px;
        color: rgba(255, 255, 255, 0.85);
      }
      .cta {
        font-size: 42px;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 40px;
      }
      .channel {
        font-size: 32px;
        color: rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="bilibili-outro"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="3"
    >
      <section
        id="outro-card"
        class="clip"
        data-start="0"
        data-duration="3"
        data-track-index="1"
      >
        <div class="thanks" id="thanks-text">感谢观看</div>
        <div class="icons">
          <div class="icon-card" id="icon-like">
            <div class="icon-circle">
              <svg viewBox="0 0 24 24">
                <title>点赞</title>
                <path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-1.91z" />
              </svg>
            </div>
            <div class="icon-label">点赞</div>
          </div>
          <div class="icon-card" id="icon-fav">
            <div class="icon-circle">
              <svg viewBox="0 0 24 24">
                <title>收藏</title>
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
              </svg>
            </div>
            <div class="icon-label">收藏</div>
          </div>
          <div class="icon-card" id="icon-follow">
            <div class="icon-circle">
              <svg viewBox="0 0 24 24">
                <title>关注</title>
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
              </svg>
            </div>
            <div class="icon-label">关注</div>
          </div>
        </div>
        <div class="cta" id="cta-text">觉得有用，欢迎点赞 · 收藏 · 关注</div>
        <div class="channel" id="channel-text">频道名</div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const vars = window.__hyperframes.getVariables();
      const duration = parseFloat(vars.duration) || 3;
      const channelName = vars.channel_name || "";

      document.getElementById("root").setAttribute("data-duration", duration);
      document.getElementById("outro-card").setAttribute("data-duration", duration);
      document.getElementById("thanks-text").textContent = vars.thanks || "感谢观看";
      document.getElementById("cta-text").textContent = vars.cta || "觉得有用，欢迎点赞 · 收藏 · 关注";

      const channelEl = document.getElementById("channel-text");
      if (channelName) {
        channelEl.textContent = "频道：" + channelName;
      } else {
        channelEl.style.display = "none";
      }

      const tl = gsap.timeline({ paused: true });
      const iconIds = ["#icon-like", "#icon-fav", "#icon-follow"];

      tl.from("#thanks-text", { y: 40, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.from(iconIds, { scale: 0, opacity: 0, duration: 0.5, ease: "back.out(1.7)", stagger: 0.12 }, 0.35);
      tl.from("#cta-text", { y: 30, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.85);
      if (channelName) {
        tl.from("#channel-text", { y: 20, opacity: 0, duration: 0.4, ease: "power3.out" }, 1.0);
      }

      window.__timelines["bilibili-outro"] = tl;
    </script>
  </body>
</html>
