<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"视频标题"},
  {"id":"channel","type":"string","label":"Channel","default":""},
  {"id":"thumb_path","type":"string","label":"Thumbnail","default":""},
  {"id":"cover_style","type":"string","label":"CoverStyle","default":"vlogger"},
  {"id":"author_name","type":"string","label":"AuthorName","default":""},
  {"id":"author_title","type":"string","label":"AuthorTitle","default":""},
  {"id":"author_badges","type":"array","label":"AuthorBadges","default":[]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Bilibili 3D 悬浮旋转竖屏封面模板 (9:16)</title>
    <style>
      /* 引入项目内共享资料库的顶级字体 */
      @font-face {
        font-family: 'NotoSansSC';
        src: url('/e:/YifuAIForge/OpenMontage/assets/shared_library/fonts/NotoSansSC-Black.ttf') format('truetype');
        font-weight: 900;
      }
      @font-face {
        font-family: 'Oswald';
        src: url('/e:/YifuAIForge/OpenMontage/assets/shared_library/fonts/Oswald-Bold.ttf') format('truetype');
        font-weight: 700;
      }

      body {
        margin: 0;
        font-family: 'NotoSansSC', system-ui, -apple-system, sans-serif;
        background-color: #040208;
        overflow: hidden;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }

      /* ==================== 氛围底色模糊 ==================== */
      .bg-blur {
        position: absolute;
        top: -80px;
        left: -80px;
        width: 1240px;
        height: 2080px;
        object-fit: cover;
        filter: blur(50px) brightness(0.28);
        z-index: 1;
      }

      .bg-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
      }

      #root.theme-vlogger .bg-overlay {
        background: radial-gradient(circle at 50% 20%, rgba(26, 15, 66, 0.45) 0%, rgba(8, 5, 26, 0.8) 60%, #040208 100%);
      }
      #root.theme-frugal_red .bg-overlay {
        background: radial-gradient(circle at 50% 20%, rgba(71, 8, 14, 0.5) 0%, rgba(26, 2, 4, 0.85) 60%, #040001 100%);
      }
      #root.theme-hardcore_dark .bg-overlay {
        background: radial-gradient(circle at 50% 20%, rgba(10, 32, 59, 0.5) 0%, rgba(2, 8, 26, 0.8) 60%, #000206 100%);
      }

      #root.theme-hardcore_dark::after {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: linear-gradient(rgba(0, 255, 204, 0.015) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(0, 255, 204, 0.015) 1px, transparent 1px);
        background-size: 50px 50px;
        z-index: 3;
        pointer-events: none;
      }

      /* ==================== 3D 偏转原封面独立卡片 (X轴旋转，产生强烈透视斜角) ==================== */
      .poster-3d-wrapper {
        position: absolute;
        left: 80px;
        bottom: 120px;
        width: 920px;
        height: 1100px;
        border-radius: 24px;
        overflow: hidden;
        transform-origin: center center;
        transform: perspective(1400px) rotateX(10deg) rotateY(-2deg);
        transform-style: preserve-3d;
        box-shadow: 
          0px 25px 50px rgba(0, 0, 0, 0.8),
          0px 0px 30px rgba(255, 255, 255, 0.05);
        z-index: 5;
      }

      /* 霓虹流光边框 */
      #root.theme-vlogger .poster-3d-wrapper {
        border: 4px solid rgba(168, 85, 247, 0.35);
      }
      #root.theme-frugal_red .poster-3d-wrapper {
        border: 4px solid rgba(239, 68, 68, 0.35);
      }
      #root.theme-hardcore_dark .poster-3d-wrapper {
        border: 4px solid rgba(6, 182, 212, 0.35);
      }

      .poster-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .poster-3d-wrapper .panel-label {
        position: absolute;
        left: 40px;
        bottom: 40px;
        padding: 10px 22px;
        background: rgba(0, 0, 0, 0.82);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        color: #ffffff;
        font-family: 'NotoSansSC', sans-serif;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1px;
        transform: translateZ(30px);
      }



      /* ==================== 前景顶部中文 3D 悬浮字 ==================== */
      .content {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        padding-top: 140px;
        box-sizing: border-box;
        z-index: 10;
      }

      /* 身份和标签容器 */
      .top-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        width: 100%;
      }

      .author-card {
        background: rgba(7, 5, 20, 0.88);
        border: 2px solid rgba(102, 139, 255, 0.45);
        border-radius: 12px;
        padding: 8px 32px;
        color: #ffffff;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 1px;
      }

      .badges-row {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
      }
      .badge-pill {
        background: rgba(8, 6, 26, 0.9);
        border: 1px solid rgba(40, 30, 105, 0.5);
        border-radius: 10px;
        padding: 6px 20px;
        color: #9cb8ff;
        font-size: 20px;
        font-weight: 900;
      }

      /* 胶囊 */
      .promo-pill {
        font-size: 22px;
        font-weight: 900;
        padding: 8px 24px;
        border-radius: 12px;
        width: fit-content;
        margin: 25px 0;
      }

      /* 3D 标题大字核心排版与 text-shadow 3D 质感堆叠 */
      .title-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        width: 100%;
        margin-bottom: auto;
      }

      .title-line {
        font-size: 96px;
        font-weight: 900;
        line-height: 1.2;
        margin: 0;
        text-align: center;
        paint-order: stroke fill;
      }

      /* vlogger 大V金立体 */
      #root.theme-vlogger .title-line {
        color: #ffffff;
        -webkit-text-stroke: 2px #000000;
        text-shadow: 
          1px 1px 0px #e6c300, 
          2px 2px 0px #cca300, 
          3px 3px 0px #b38f00, 
          4px 4px 0px #997a00, 
          5px 5px 0px #806600,
          6px 6px 15px rgba(0, 0, 0, 0.95);
      }
      #root.theme-vlogger .gold-text {
        background: linear-gradient(to bottom, #ffe600 20%, #ff8800 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      #root.theme-vlogger .promo-pill {
        background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
        color: #ffffff;
        box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3);
      }

      /* frugal_red 爆裂红黄立体 */
      #root.theme-frugal_red .title-line {
        color: #ffffff;
        -webkit-text-stroke: 2px #2b0002;
        text-shadow: 
          1px 1px 0px #ff3333, 
          2px 2px 0px #e62e2e, 
          3px 3px 0px #cc2929, 
          4px 4px 0px #b32424, 
          5px 5px 0px #991f1f,
          6px 6px 15px rgba(0, 0, 0, 0.95);
      }
      #root.theme-frugal_red .gold-text {
        background: linear-gradient(to bottom, #ffea00 20%, #ff9500 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      #root.theme-frugal_red .title-line:not(.gold-text) {
        background: linear-gradient(to bottom, #ff3333 20%, #bd0000 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      #root.theme-frugal_red .promo-pill {
        background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
        color: #ffffff;
        border: 1px solid #fca5a5;
        box-shadow: 0 4px 15px rgba(220, 38, 38, 0.45);
      }

      /* hardcore_dark 极客青绿发光立体 */
      #root.theme-hardcore_dark .title-line {
        color: #ffffff;
        -webkit-text-stroke: 2px #021a36;
        text-shadow: 
          1px 1px 0px #00ffcc, 
          2px 2px 0px #00e6b8, 
          3px 3px 0px #00cc9f, 
          4px 4px 0px #00b38b, 
          5px 5px 0px #009977,
          6px 6px 15px rgba(0, 255, 204, 0.35);
      }
      #root.theme-hardcore_dark .gold-text {
        background: linear-gradient(to bottom, #00f0ff 20%, #0077ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      #root.theme-hardcore_dark .promo-pill {
        background: #020d2b;
        color: #00ffcc;
        border: 1px solid #00f0ff;
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
      }

      /* 底部金句 */
      .footer-quote {
        color: #facc15;
        font-size: 22px;
        font-weight: 900;
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: center;
      }
      .footer-quote::before {
        content: "💬";
      }

      /* 底部金色饰条 */
      .bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 10px;
        background-color: #ffd700;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="cover_vertical" data-no-timeline data-width="1080" data-height="1920" data-start="0" data-duration="0.1">
      
      <!-- 氛围模糊底图 -->
      <img id="bg-blur" class="bg-blur" alt="背景模糊" />
      <div class="bg-overlay"></div>

      <!-- 3D 悬浮旋转卡片 (中心轴偏转，带明显斜角) -->
      <div class="poster-3d-wrapper">
        <img id="thumb-img" class="poster-img" alt="原视频封面" />
        <div class="panel-label" id="panel-label"></div>
      </div>

      <!-- 前景顶部大字 -->
      <div class="content">
        
        <!-- 顶部身份信息 -->
        <div class="top-section">
          <div class="author-card" id="author-info">
            频道
          </div>
          <div class="badges-row" id="badges-container">
            <!-- 动态载入标签 -->
          </div>
        </div>

        <!-- 药丸 -->
        <div class="promo-pill" id="promo-tag">
          中文配音 · 免费观看
        </div>

        <!-- 3D 标题字 -->
        <div class="title-container" id="title-lines">
          <!-- 动态加载标题行 -->
        </div>

        <!-- 底部金句 -->
        <div class="footer-quote" id="footer-text">
          中文AI配音 · 一键追番
        </div>

      </div>

      <!-- 底部金色饰条 -->
      <div class="bottom-bar"></div>

    </div>

    <script>
      const v = window.__hyperframes.getVariables();

      const coverStyle = v.cover_style || "vlogger";
      document.getElementById("root").className = "theme-" + coverStyle;

      const thumbImg = document.getElementById("thumb-img");
      const bgBlur = document.getElementById("bg-blur");
      if (v.thumb_path) {
        thumbImg.src = v.thumb_path;
        bgBlur.src = v.thumb_path;
      }
      
      const panelLabel = document.getElementById("panel-label");
      if (v.channel) {
        panelLabel.textContent = `原片 · ${v.channel}`;
      }

      if (v.author_name && v.author_title) {
        document.getElementById("author-info").textContent = `${v.author_title} | ${v.author_name}`;
      } else if (v.channel) {
        document.getElementById("author-info").textContent = `频道 · ${v.channel}`;
      }
      
      const badgesContainer = document.getElementById("badges-container");
      badgesContainer.innerHTML = "";
      const badgesToUse = (v.author_badges && v.author_badges.length > 0) ? v.author_badges : [];
      
      badgesToUse.forEach(badgeText => {
        const pill = document.createElement("span");
        pill.className = "badge-pill";
        pill.textContent = badgeText;
        badgesContainer.appendChild(pill);
      });

      if (coverStyle === "frugal_red") {
        document.getElementById("promo-tag").textContent = "省钱搞钱实战 · 纯干货推荐";
        document.getElementById("footer-text").textContent = "中文AI翻译 · 完全免费";
      } else if (coverStyle === "hardcore_dark") {
        document.getElementById("promo-tag").textContent = "开源黑科技 · 进阶开发者必备";
        document.getElementById("footer-text").textContent = "代码终端实操 · 拒绝假大空";
      } else {
        document.getElementById("promo-tag").textContent = "国外大V干货 · 中文配音";
        document.getElementById("footer-text").textContent = "中文AI配音 · 一键追番";
      }

      const titleLinesContainer = document.getElementById("title-lines");
      titleLinesContainer.innerHTML = "";

      let rawTitle = v.title || "视频标题";
      let lines = rawTitle.split("\n");

      lines.forEach((lineText, idx) => {
        if (!lineText.trim()) return;
        const h1 = document.createElement("h1");
        h1.className = "title-line";
        h1.textContent = lineText.trim();
        
        if (idx > 0 || lineText.startsWith("/")) {
          h1.classList.add("gold-text");
        }
        titleLinesContainer.appendChild(h1);
      });
    </script>
  </body>
</html>
