<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"视频标题"},
  {"id":"channel","type":"string","label":"Channel","default":""},
  {"id":"thumb_path","type":"string","label":"Thumbnail","default":""}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Bilibili Cover</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .bg-full {
        position: absolute; inset: 0;
        background: linear-gradient(160deg, #0a0820 0%, #151030 35%, #1a1840 65%, #252050 100%);
      }
      .bg-full::before {
        content: ""; position: absolute; top: -200px; left: 50%; transform: translateX(-50%);
        width: 1000px; height: 500px; border-radius: 50%;
        background: radial-gradient(ellipse, rgba(255,110,90,0.15) 0%, transparent 65%);
      }
      .bg-full::after {
        content: ""; position: absolute; bottom: -240px; left: 50%; transform: translateX(-50%);
        width: 1100px; height: 460px; border-radius: 50%;
        background: radial-gradient(ellipse, rgba(80,160,255,0.12) 0%, transparent 65%);
      }
      .safe {
        position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
        width: 1440px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 26px; padding: 40px 60px; box-sizing: border-box;
      }
      .chan { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.85); font-size: 22px; font-weight: 600; padding: 8px 28px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.12); }
      h1 { font-size: 64px; font-weight: 800; color: #fff; line-height: 1.3; text-align: center; text-shadow: 0 4px 30px rgba(0,0,0,0.5); max-width: 1000px; margin: 0; }
      h1 .gold { color: #FFD700; text-shadow: 0 0 30px rgba(255,215,0,0.3); }
      .thumb-frame { width: 640px; height: 360px; border-radius: 16px; overflow: hidden; border: 3px solid rgba(255,255,255,0.14); box-shadow: 0 20px 60px rgba(0,0,0,0.55); }
      .thumb-frame img { width: 100%; height: 100%; object-fit: cover; }
      .tags { display: flex; gap: 14px; }
      .tag { font-size: 22px; font-weight: 700; padding: 8px 24px; border-radius: 8px; }
      .t1 { background: linear-gradient(135deg, #ff6b5e, #e03030); color: #fff; }
      .t2 { background: linear-gradient(135deg, #4facfe, #00b4d8); color: #000; }
      .t3 { background: linear-gradient(135deg, #a855f7, #7c3aed); color: #fff; }
      .footer { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: linear-gradient(to right, #ff6b5e, #4facfe, #a855f7, #FFD700); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="cover" data-width="1920" data-height="1080" data-start="0" data-duration="0.1">
      <div class="bg-full"></div>
      <div class="safe">
        <div class="chan" id="chan-tag">@channel</div>
        <h1 id="title-text"><span class="gold">视频</span>标题</h1>
        <div class="thumb-frame"><img id="thumb-img" src="" alt="" /></div>
        <div class="tags">
          <span class="tag t1">AI</span><span class="tag t2">中文配音</span><span class="tag t3">教程</span>
        </div>
      </div>
      <div class="footer"></div>
    </div>
    <script>
      const v = window.__hyperframes.getVariables();
      document.getElementById("title-text").innerHTML = v.title || "视频标题";
      document.getElementById("chan-tag").textContent = v.channel ? "@" + v.channel : "";
      if (!v.channel) document.getElementById("chan-tag").style.display = "none";
      const img = document.getElementById("thumb-img");
      img.src = v.thumb_path || "";
      if (!v.thumb_path) img.parentElement.style.background = "rgba(255,255,255,0.04)";
    </script>
  </body>
</html>
