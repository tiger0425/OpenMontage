<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"视频标题"},
  {"id":"channel","type":"string","label":"Channel","default":""},
  {"id":"thumb_path","type":"string","label":"Thumbnail","default":""},
  {"id":"cover_style","type":"string","label":"CoverStyle","default":"vlogger"},
  {"id":"author_name","type":"string","label":"AuthorName","default":""},
  {"id":"author_title","type":"string","label":"AuthorTitle","default":""},
  {"id":"author_badges","type":"array","label":"AuthorBadges","default":[]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Bilibili 3D 悬浮旋转横屏封面模板 (16:9)</title>
    <style>
      /* 引入项目内共享资料库的顶级字体 */
      @font-face {
        font-family: 'NotoSansSC';
        src: url('/e:/YifuAIForge/OpenMontage/assets/shared_library/fonts/NotoSansSC-Black.ttf') format('truetype');
        font-weight: 900;
      }
      @font-face {
        font-family: 'Oswald';
        src: url('/e:/YifuAIForge/OpenMontage/assets/shared_library/fonts/Oswald-Bold.ttf') format('truetype');
        font-weight: 700;
      }

      body {
        margin: 0;
        font-family: 'NotoSansSC', system-ui, -apple-system, sans-serif;
        background-color: #040208;
        overflow: hidden;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      /* ==================== 氛围底色模糊 ==================== */
      .bg-blur {
        position: absolute;
        top: -80px;
        left: -80px;
        width: 2080px;
        height: 1240px;
        object-fit: cover;
        filter: blur(55px) brightness(0.28);
        z-index: 1;
      }

      .bg-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
      }

      #root.theme-vlogger .bg-overlay {
        background: radial-gradient(circle at 20% 50%, rgba(26, 15, 66, 0.45) 0%, rgba(8, 5, 26, 0.8) 60%, #040208 100%);
      }
      #root.theme-frugal_red .bg-overlay {
        background: radial-gradient(circle at 20% 50%, rgba(71, 8, 14, 0.5) 0%, rgba(26, 2, 4, 0.85) 60%, #040001 100%);
      }
      #root.theme-hardcore_dark .bg-overlay {
        background: radial-gradient(circle at 20% 50%, rgba(10, 32, 59, 0.5) 0%, rgba(2, 8, 26, 0.8) 60%, #000206 100%);
      }

      #root.theme-hardcore_dark::after {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image: linear-gradient(rgba(0, 255, 204, 0.015) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(0, 255, 204, 0.015) 1px, transparent 1px);
        background-size: 60px 60px;
        z-index: 3;
        pointer-events: none;
      }

      /* ==================== 3D 偏转原封面独立卡片 (完整16:9 + 倾斜旋转 + 主题色背板) ==================== */
      .poster-3d-wrapper {
        position: absolute;
        right: 80px;
        top: 238px;
        width: 1040px;
        height: 603px;
        border-radius: 24px;
        box-sizing: border-box;
        padding: 16px;
        overflow: hidden;
        /* 中心轴偏转 + 轻微 2D 倾斜旋转，完整展示原封面 */
        transform-origin: center center;
        transform: perspective(1400px) rotateY(-10deg) rotateX(2deg) rotate(-2.5deg);
        transform-style: preserve-3d;
        box-shadow: 
          -15px 25px 50px rgba(0, 0, 0, 0.75),
          0px 0px 40px rgba(255, 255, 255, 0.05);
        z-index: 5;
      }

      /* 霓虹流光边框 + 与外框同色系背板 */
      #root.theme-vlogger .poster-3d-wrapper {
        border: 4px solid rgba(168, 85, 247, 0.55);
        background: linear-gradient(145deg, #2b1152, #170a2e);
      }
      #root.theme-frugal_red .poster-3d-wrapper {
        border: 4px solid rgba(239, 68, 68, 0.55);
        background: linear-gradient(145deg, #450a0f, #2b0508);
      }
      #root.theme-hardcore_dark .poster-3d-wrapper {
        border: 4px solid rgba(6, 182, 212, 0.55);
        background: linear-gradient(145deg, #062a35, #03141b);
      }

      .poster-frame {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 14px;
        overflow: hidden;
      }

      .poster-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .poster-frame .panel-label {
        position: absolute;
        right: 40px;
        bottom: 40px;
        padding: 10px 22px;
        background: rgba(0, 0, 0, 0.82);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        color: #ffffff;
        font-family: 'NotoSansSC', sans-serif;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1px;
        transform: translateZ(30px);
      }



      /* ==================== 前景左侧中文 3D 悬浮字 ==================== */
      .content {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        display: flex;
        align-items: center;
        padding-left: 100px;
        box-sizing: border-box;
        z-index: 10;
      }

      .left-section {
        width: 680px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 850px;
      }

      /* 标签行 */
      .header-row {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 20px;
      }

      .author-card {
        background: rgba(7, 5, 20, 0.88);
        border: 2px solid rgba(102, 139, 255, 0.45);
        border-radius: 12px;
        padding: 6px 24px;
        color: #ffffff;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 1px;
      }

      /* 勋章标签 */
      .badges-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 30px;
      }
      .badge-pill {
        background: rgba(8, 6, 26, 0.9);
        border: 1px solid rgba(40, 30, 105, 0.5);
        border-radius: 10px;
        padding: 6px 18px;
        color: #9cb8ff;
        font-size: 18px;
        font-weight: 900;
      }

      /* 高亮胶囊 */
      .promo-pill {
        font-size: 20px;
        font-weight: 900;
        padding: 8px 22px;
        border-radius: 12px;
        width: fit-content;
        margin-bottom: 28px;
      }

      /* 3D 标题大字核心排版与 text-shadow 3D 质感堆叠 */
      .title-container {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .title-line {
        font-size: 88px;
        font-weight: 900;
        line-height: 1.15;
        margin: 0;
        paint-order: stroke fill;
      }

      /* vlogger 大V金立体 */
      #root.theme-vlogger .title-line {
        color: #ffffff;
        -webkit-text-stroke: 2px #000000;
        text-shadow: 
          1px 1px 0px #e6c300, 
          2px 2px 0px #cca300, 
          3px 3px 0px #b38f00, 
          4px 4px 0px #997a00, 
          5px 5px 0px #806600,
          6px 6px 15px rgba(0, 0, 0, 0.95);
      }
      #root.theme-vlogger .gold-text {
        background: linear-gradient(to bottom, #ffe600 20%, #ff8800 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      #root.theme-vlogger .promo-pill {
        background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
        color: #ffffff;
        box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3);
      }

      /* frugal_red 爆裂红黄立体 */
      #root.theme-frugal_red .title-line {
        color: #ffffff;
        -webkit-text-stroke: 2px #2b0002;
        text-shadow: 
          1px 1px 0px #ff3333, 
          2px 2px 0px #e62e2e, 
          3px 3px 0px #cc2929, 
          4px 4px 0px #b32424, 
          5px 5px 0px #991f1f,
          6px 6px 15px rgba(0, 0, 0, 0.95);
      }
      #root.theme-frugal_red .gold-text {
        background: linear-gradient(to bottom, #ffea00 20%, #ff9500 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      #root.theme-frugal_red .title-line:not(.gold-text) {
        background: linear-gradient(to bottom, #ff3b30 20%, #c70000 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      #root.theme-frugal_red .promo-pill {
        background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
        color: #ffffff;
        border: 1px solid #fca5a5;
        box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
      }

      /* hardcore_dark 极客青绿发光立体 */
      #root.theme-hardcore_dark .title-line {
        color: #ffffff;
        -webkit-text-stroke: 2px #021a36;
        text-shadow: 
          1px 1px 0px #00ffcc, 
          2px 2px 0px #00e6b8, 
          3px 3px 0px #00cc9f, 
          4px 4px 0px #00b38b, 
          5px 5px 0px #009977,
          6px 6px 15px rgba(0, 255, 204, 0.35);
      }
      #root.theme-hardcore_dark .gold-text {
        background: linear-gradient(to bottom, #00f0ff 20%, #0077ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      #root.theme-hardcore_dark .promo-pill {
        background: #020d2b;
        color: #00ffcc;
        border: 1px solid #00f0ff;
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
      }

      /* 底部金句 */
      .footer-quote {
        margin-top: 60px;
        color: #facc15;
        font-size: 22px;
        font-weight: 900;
        display: flex;
        align-items: center;
        gap: 10px;
        }
      .footer-quote::before {
        content: "💬";
      }

      /* 底部金色饰条 */
      .bottom-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 8px;
        background-color: #ffd700;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="cover" data-no-timeline data-width="1920" data-height="1080" data-start="0" data-duration="0.1">
      
      <!-- 氛围模糊底图 -->
      <img id="bg-blur" class="bg-blur" alt="背景模糊" />
      <div class="bg-overlay"></div>

      <!-- 3D 悬浮旋转卡片 (完整16:9 + 倾斜 + 主题背板) -->
      <div class="poster-3d-wrapper">
        <div class="poster-frame">
          <img id="thumb-img" class="poster-img" alt="原视频封面" />
          <div class="panel-label" id="panel-label"></div>
        </div>
      </div>

      <!-- 前景左侧中文大字 -->
      <div class="content">
        <div class="left-section">
          
          <div class="header-row">
            <div class="author-card" id="author-info">
              频道
            </div>
          </div>

          <div class="badges-row" id="badges-container">
            <!-- 动态载入标签 -->
          </div>

          <div class="promo-pill" id="promo-tag">
            中文配音 · 免费观看
          </div>

          <div class="title-container" id="title-lines">
            <!-- 动态加载标题行 -->
          </div>

          <div class="footer-quote" id="footer-text">
            中文AI配音 · 一键追番
          </div>

        </div>
      </div>

      <!-- 底部金色饰条 -->
      <div class="bottom-bar"></div>

    </div>

    <script>
      const v = window.__hyperframes.getVariables();

      const coverStyle = v.cover_style || "vlogger";
      document.getElementById("root").className = "theme-" + coverStyle;

      const thumbImg = document.getElementById("thumb-img");
      const bgBlur = document.getElementById("bg-blur");
      if (v.thumb_path) {
        thumbImg.src = v.thumb_path;
        bgBlur.src = v.thumb_path;
      }
      
      const panelLabel = document.getElementById("panel-label");
      if (v.channel) {
        panelLabel.textContent = `原片 · ${v.channel}`;
      }

      if (v.author_name && v.author_title) {
        document.getElementById("author-info").textContent = `${v.author_title} | ${v.author_name}`;
      } else if (v.channel) {
        document.getElementById("author-info").textContent = `频道 · ${v.channel}`;
      }
      
      const badgesContainer = document.getElementById("badges-container");
      badgesContainer.innerHTML = "";
      const badgesToUse = (v.author_badges && v.author_badges.length > 0) ? v.author_badges : [];
      
      badgesToUse.forEach(badgeText => {
        const pill = document.createElement("span");
        pill.className = "badge-pill";
        pill.textContent = badgeText;
        badgesContainer.appendChild(pill);
      });

      if (coverStyle === "frugal_red") {
        document.getElementById("promo-tag").textContent = "省钱搞钱实战 · 纯干货推荐";
        document.getElementById("footer-text").textContent = "中文AI翻译 · 完全免费";
      } else if (coverStyle === "hardcore_dark") {
        document.getElementById("promo-tag").textContent = "开源黑科技 · 进阶开发者必备";
        document.getElementById("footer-text").textContent = "代码终端实操 · 拒绝假大空";
      } else {
        document.getElementById("promo-tag").textContent = "国外大V干货 · 中文配音";
        document.getElementById("footer-text").textContent = "中文AI配音 · 一键追番";
      }

      const titleLinesContainer = document.getElementById("title-lines");
      titleLinesContainer.innerHTML = "";

      let rawTitle = v.title || "视频标题";
      let lines = rawTitle.split("\n");

      lines.forEach((lineText, idx) => {
        if (!lineText.trim()) return;
        const h1 = document.createElement("h1");
        h1.className = "title-line";
        h1.textContent = lineText.trim();
        
        if (idx > 0 || lineText.startsWith("/")) {
          h1.classList.add("gold-text");
        }
        titleLinesContainer.appendChild(h1);
      });
    </script>
  </body>
</html>
