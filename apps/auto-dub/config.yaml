# ============================================================
glossary:
  # 用户可编辑术语表路径（可选文件，缺失/非法不阻断；域术语优先级 > 内置）
  user_glossary_path: "apps/auto-dub/user_glossary.json"
  # 内置域词表：按触发词命中当前句后注入对应词条（只注入本句实际出现的术语）
