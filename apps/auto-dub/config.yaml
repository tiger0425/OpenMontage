# ============================================================
# 批量处理
# ============================================================
batch:
  max_per_run: 15              # 每次最多处理 15 个视频
  download_quality: "best"     # yt-dlp 下载质量
  search_max_results: 10       # 每个关键词最多搜索结果数

# ============================================================
# 片尾配置（B站一键三连风格）
# ============================================================
outro:
  engine: hyperframes
  style: bilibili
  min_duration_seconds: 1.5
  max_duration_seconds: 5.0
  drift_fail_threshold_seconds: 120.0   # 漂移在此内允许出片（tpad 冻末帧延展吸收），超过才失败重翻
  # 片尾显示的频道名（@ 账号引导）；留空则不显示任何频道名
  channel_name: ""
  text:
    thanks: "感谢观看"
    cta: "觉得有用，欢迎点赞 · 收藏 · 关注"

# ============================================================
# 封面图配置（HyperFrames 模板渲染）
# ============================================================
# 格式：1200×900 (4:3)，符合 B站 封面要求
# 模板：apps/auto-dub/templates/covers/<频道>/cover.html（每频道一个专属模板）
# 变量：title（标题党中文标题）、channel（频道名）、thumb_path（缩略图路径）
# channel_templates: 频道名 → 模板相对路径（相对 templates/ 目录）。
#   视频按其 channel 字段匹配专属模板；未配置/模板缺失时回退到默认 cover.html。
cover:
  engine: hyperframes
  template: cover.html            # 默认模板（回退用）
  width: 1200
  height: 900
  # 注释掉专属模板，统一走自适应通用 3D 景深封面模板
  channel_templates:
    # AI Search 周报系列：三画幅专属模板（dict 按尺寸指定；str 则只覆盖 16:9）
    "AI Search":
      "16:9": "cover_ai_weekly.html"
      "4:3": "cover_ai_weekly_4_3.html"
      "9:16": "cover_ai_weekly_vertical.html"
    # "Chris Moran": "covers/chris-moran/cover.html"
    # "Mark Ai Guy": "covers/mark-ai-guy/cover.html"
    # "Matthew Berman": "covers/matthew-berman/cover.html"
  # 周报徽章频道：封面自动注入 year/week/week_label/week_range（按视频发布日期算 ISO 周）
  weekly_channels: ["AI Search"]

# ============================================================
# 访谈类视频分类与调速配置
# ============================================================
interview:
  enabled: true
  classification:
    min_duration_seconds: 180        # 时长 >= 3分钟视为访谈/长视频
  atempo:
    enabled: true                    # 全局调速兜底开关（末段安全网）
    drift_budget: 1.5                # 漂移 <= 此值由逐句对齐+溢出推挤吸收，不触发全局 atempo
    max_drift_seconds: 120.0          # 漂移在此范围内允许末段兜底调速（超过才失败重翻）
    min_speed_factor: 0.96           # 兜底最慢 96%
    max_speed_factor: 1.05           # 兜底最快 105%（听感已验证上限；tt-test 实测仅需 1.02-1.03，勿放宽）

# ============================================================
# 输出路径
# ============================================================
output:
  base_dir: "projects/auto-dub"
  review_dir: "projects/auto-dub/review"
  published_dir: "projects/auto-dub/published"

# ============================================================
# 数据库
# ============================================================
database:
  path: "projects/auto-dub/tracking.db"
