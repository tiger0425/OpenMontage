# Auto-Dub 配置文件
# YouTube 视频自动发现、翻译配音与批量处理系统

# ============================================================
# 频道订阅列表
# ============================================================
channels:
  - name: "AI For You"
    url: "https://www.youtube.com/@AIForYou-y3p"
  - name: "Fahd Mirza"
    url: "https://www.youtube.com/@fahdmirza"
  - name: "Prompt Engineer"
    url: "https://www.youtube.com/@PromptEngineer48"
  - name: "Matthew Berman"
    url: "https://www.youtube.com/@matthew_berman"
  - name: "WorldofAI"
    url: "https://www.youtube.com/@intheworldofai"
  - name: "Cole Medin"
    url: "https://www.youtube.com/@ColeMedin"
  - name: "Alejandro AO"
    url: "https://www.youtube.com/@alejandro_ao"
  - name: "Sam Witteveen"
    url: "https://www.youtube.com/@samwitteveenai"
  - name: "AI Anytime"
    url: "https://www.youtube.com/@AIAnytime"

# ============================================================
# 搜索关键词
# ============================================================
keywords:
  - "run LLM locally free Ollama LM Studio tutorial"
  - "Google Colab free GPU fine tune LLM open source"
  - "free AI API credits OpenRouter Gemini tier tutorial"
  - "build local AI agent Ollama Open WebUI no cost"
  - "free alternative Cursor GitHub Copilot local model"
  - "Unsloth HuggingFace Google Colab tutorial free"
  - "free cloud GPU for AI training Kaggle Colab Lambda"

# ============================================================
# 筛选规则
# ============================================================
filters:
  min_duration_seconds: 180    # 3 分钟
  max_duration_seconds: 1200   # 20 分钟
  max_age_days: 30             # 最近 30 天
  exclude_languages: ["zh"]    # 排除中文视频
  # LLM 内容相关性判断 prompt
  relevance_prompt: |
    你是一个视频内容分类器。请判断以下 YouTube 视频是否讲解了
    以下任意一个主题：
    1. 如何利用免费的 AI 模型（如 Ollama, LM Studio, Hugging Face 开源模型）
    2. 如何利用免费的云服务或 GPU（如 Google Colab, Kaggle, Lightning AI）
    3. 如何利用免费的 API 额度（如 Gemini 免费层, OpenRouter 免费额度）
    4. 免费的 AI 开发工具和资源（如免费编程助手、免费 Agent 框架）

    视频标题: {title}
    视频描述: {description}

    只回答 yes 或 no。

# ============================================================
# 管线参数
# ============================================================
pipeline:
  name: localization-dub
  target_language: zh-CN
  source_language: en-US
  tts_engine: indextts
  tts_emotion: calm              # 合成情感：calm=固定平静（贴合原版平淡语气，默认）；auto=服务端从文字自动判情感
  tts_model_version: "2.5"       # IndexTTS 模型版本：2.5（默认，原生语速 duration_factor + 五语种）；2=回退 IndexTTS-2
  tts_lang: ""                   # 2.5 语种标签，留空则从 target_language 自动映射（zh-CN→ZH）
  tts_use_qwen_emo: false        # 2.5 是否加载 QwenEmotion（use_emo_text 自动判情感需要）；固定 calm 向量时无需
  # 音轨混合模式：replace=整轨替换（默认，标准流程：只保留中文配音）；
  #               game_audio=保留游戏声/BGM（先 demucs 分离解说 vocals 与游戏伴奏 no_vocals，
  #               用 no_vocals 做底音轨，中文配音叠加在解说时段）
  mix_mode: game_audio
  # 游戏声/BGM 底音轨音量倍率（game_audio 模式有效）：1.0=原音量，1.05=提高 5%
  game_audio_volume: 1.05
  # 字幕模式：bottom=烧在画面底部（默认，标准流程）；
  #           caption_overlay=画面标注遮盖+原位替换（检测画面内教学标注条，半透明黑条遮盖英文，
  #           在原位置烧录中文标注翻译）；
  #           none=不烧字幕到画面（只生成 SRT 字幕文件留档，供外部挂载/上传）
  subtitle_mode: bottom
  subtitle_driven: off           # 画面字幕驱动分段：实测 OCR/帧差分不稳（漏字、条不准），默认关闭；仅画面字幕清晰时手动开启
  whisper_model: large-v3         # 转录模型（准确率优先）：base(快) < small < medium < large-v3(最准，慢)
  min_char_budget: 15            # 中文字符预算下限，避免短句预算过小导致过度拆分
  subtitle_style: "中文+术语英文标注"
  output_format: "source"      # 输出画面格式：source/auto=跟随原视频画幅（横屏出横屏、竖屏出竖屏，默认透传）；16:9（横屏）/ 4:3 / 9:16（竖屏，上下模糊填充保留完整画面）为显式覆盖
  render_runtime: ffmpeg        # 使用 FFmpeg 合成（替换音轨+烧字幕）
  diarize: auto                  # auto=全量跑说话人分离按结果分档（多人/单人）；off=跳过（现状）
  human_review: single-auto        # 人审分流（说话人审校 + 翻译审校，ticket #10/#9）：single-auto=所有视频（含单人）都生成 speaker_review.md + translation_review.md，单人自动通过留档、多人强制人审；required=所有视频强制人审；auto=仅多人强制人审（单人连文档都不生成）
  synth_retry_max: 2             # 合成失败重试上限（ticket #11）：单人子块 TTS 失败/静音伪文件重试 N 次；多人 0 次直接人审
  multi_synth_failure_review: true  # 多人合成失败后直接人审（ticket #11）：生成 synthesis_review.md 挂起 assets 等人审
  translation_domain: general    # tech=技术教程域（AI/云技术专业词汇，队列默认）；general=通用/对话域（口语化、保持情感）
  translation:
    untranslated_check: true     # 漏译/未翻译检测：译文中文占比过低时单条重译
    untranslated_ratio: 0.5      # 漏译判定阈值：汉字 / 非空白非标点字符 < 此值视为未翻译
    cps_safety_factor: 0.7       # 长度预算 cps 打折系数：校准值 5.8 是长文本均值，短句真实 cps 约 3.6-4.2，乘 0.7 ≈ 4.1
    # 漂移风险前向驱动（ADR-006 D1/D2）：英→中膨胀率预估译文长度，极端密集句提前收紧预算
    zh_chars_per_en_word: 1.046  # 英→中膨胀率：实测 53 项目/7648 句 = 中文字数/英文词数 ≈ 1.046（不随句长变化）
    risk_discount_floor: 0.9     # 保守折扣下限：仅极端密集句触发，避免「过度砍删」（铁律）
    risk_trigger_threshold: 1.3  # 触发阈值：预估译文超预算 >1.3× 才收紧；其余交逐句变速+溢出推挤吸收
  # 分段清理链（diarization 后、原句合并前）：治 pyannote 假翻转微段/Whisper 按呼吸切句/超长段
  segments:
    enabled: true                # 是否启用分段清理链
    merge_max_chars: 240         # 合并续句后最大字符数（超限不并）
    micro_duration_seconds: 1.0  # 微段时长阈值：< 此值且 < micro_chars 视为假说话人翻转产物，并入相邻段
    micro_chars: 40              # 微段字符阈值
    split_threshold_seconds: 15.0 # 超长段拆分阈值（> 此值在句子边界拆，默认同 max_utterance_seconds）
  # 声纹参考：多段择优拼接（替代单段最长），更长更干净的 ref 让 IndexTTS2 克隆更稳
  voice_ref:
    target_seconds: 30.0         # 拼接目标时长（秒）
    min_seconds: 6.0             # 不足此秒数的 speaker 跳过（无法稳定克隆）
    sweet_min: 1.5               # 甜点段时长下限（1.5–12s 为最佳克隆段）
    sweet_max: 12.0              # 甜点段时长上限
    long_cap: 15.0               # 超甜点段单次截断上限（秒）
  alignment:
    merge_gap_seconds: 0.5       # 原句合并：相邻转录段最大时间间隙
    max_utterance_seconds: 15.0  # 原句合并：单句上限，超限不硬并
    chunk_max_chars: 40          # 语段切合成子块（Chunk）的最大字符数
    tempo_budget: 0.05           # 逐句变速预算 ±5%（保音高）
    tolerance: 0.15              # 对齐容差 ±15%（验收达标率）
    inherently_long_seconds: 1.0 # 物理不可达句阈值（原句 < 1s，允许超容差且不计入达标率）
    queue_gap_seconds: 0.10      # 排队间隔 100ms（变速目标 = 原句时长 − 排队间隔）
    allow_slowdown: false         # 是否允许放慢语速对齐时间槽：true=允许 duration_factor/atempo 拉长配音贴合原句（默认，追求音画同步）；false=只禁放慢、允许加快（听感自然，配音可能略短于原画面）
    block_gap_seconds: 1.0       # 语段切分：相邻原句间隙 >= 此值 → 新语段
    block_max_pause_seconds: 0.8 # 语段内句间自然停顿上限（富余时间分摊，防拖沓）
    retranslate: false           # 缩短重翻：默认关闭（避免砍句子导致"句子被截断"）；true=变速不可达句改写更短塞进时间窗

# ============================================================
# 自动审核 (替代 human_approval)
# ============================================================
auto_review:
  max_fix_loops: 3             # 每个阶段最多自动修复 3 轮
  checks:
    idea:
      - brief_schema_valid
      - target_language_set
      - source_language_detected
    script:
      - transcript_not_empty
      - translation_completeness
      - glossary_terms_preserved
      - no_untranslated_sentences
    scene_plan:
      - all_scenes_have_timing
      - dub_mode_set
      - subtitle_format_correct

# ============================================================
