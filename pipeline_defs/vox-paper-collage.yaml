# 保留而非删除：examples/vox-paper-collage/ 的 6 份样例仍有参考价值。
# 处置决策与分阶段计划见 docs/optimization-charters/vox-pipeline-simplification.md
#
# 注意：stability 仍写作 beta。schema 的 stability 是封闭枚举（production|beta），
