name: vox-paper-collage
version: '1.0'
description: >
  Old-newspaper archival paper-collage documentary engine (VOX ANIMATIONS).
  Fern-style continuous narration, one handcrafted editorial collage image per beat,
  deterministic HyperFrames paper-collage animation per beat (locked camera,
  build-on assembly followed by living paper poster, final frame exactly matches the
  image), IndexTTS2 narration after script approval, Pixabay music, Freesound paper
  ASMR, and VOX 3-thumbnail publish. Forged by the pipeline-forge meta-pipeline.
category: custom
# ── 已冻结（2026-10-04）───────────────────────────────────────────────────────
# 本 manifest 由 pipeline-forge 元管线机器生成，从未被执行过一次（0 checkpoint / 0 产物）。
# 实测体量 29 文件 / 6216 行，占 VOX 纸质拼贴视觉风格总量的 59.5%；而实际出片走的是
