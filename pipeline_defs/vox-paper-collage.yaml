orchestration:
  mode: executive-producer
  skill: pipelines/vox-paper-collage/executive-producer
  budget_default_usd: 3.0
  max_revisions_per_stage: 3
  max_send_backs: 3
  max_wall_time_minutes: 30
compatible_playbooks:
  recommended:
  - vox-paper-collage
  also_works: []
  custom_allowed: true
stages:
- name: idea
  skill: pipelines/vox-paper-collage/idea-director
  produces:
  - brief
  tools_available: []
  checkpoint_required: true
  human_approval_default: true
  review_focus:
  - Niche selection follows engine STATE 1 options (crime default plus 7 options plus custom)
  - Ten ideas follow engine STATE 2 rules (title shapes, no two ideas in same sub-territory, concrete hook per idea)
  - Each idea carries a concrete hook (date, name, number, or place)
  - Optional Source Material PDF absorbed at idea stage when provided (writing DNA and thumbnail DNA override)
  - Idea proposal uses engine title shapes - no clickbait
  - 'BILINGUAL title shapes (bilingual-spec section 3): en uses engine title shapes verbatim; zh uses Chinese documentary shapes (始末/追缉/真相/全记录), never word-for-word translations of English shapes'
  success_criteria:
  - Schema-valid brief artifact
  - Brief contains at least 10 candidate ideas with hooks
  - One idea selected by the human with a clear hook
- name: proposal
  skill: pipelines/vox-paper-collage/proposal-director
  required_artifacts_in:
  - brief
  produces:
  - proposal_packet
  - decision_log
  tools_available: []
  checkpoint_required: true
  human_approval_default: true
  review_focus:
  - Duration locked from engine STATE 3 options (30s, 1, 2, 3, 5 min)
  - 'BILINGUAL (2026-08): narration_language decided FIRST, then word_target read from bilingual-spec section 1 by language (en 2.5 wps: 30s about 75 words, 5min about 750; zh 4.7 chars/s: 30s about 140 chars, 5min about 1400) - never mix the two constant sets'
  - 'render_runtime locked to hyperframes **based on registry check**; if both runtimes are available, present Remotion and HyperFrames per AGENT_GUIDE HARD RULE and log `options_considered` before locking. If only HyperFrames is available, record `rejected_because: runtime not available` for Remotion'
  - 'BUDGET FORMULA (2026-08 用户优化): multi_grid_refs x $0.05 + (bg_count + hero_count + element_count) x $0.05 + thumbnail_count x $0.05 + 30% retry buffer. Old formula "image count x $0.05" is deprecated and underestimates by ~80% (multi-layer structure is 4-5 images per scene, not 1)'
  - narration_language decided (default en, switchable to zh)
  - Cost estimate itemized and honest
  - 'DATA AUTHENTICITY PLAN (2026-08): every beat''s visual elements classified as real_data / real_content / creative / css; real_data elements carry source (yfinance/official/verified) + key data points; real_data and real_content planned for Qwen21-edit restyle (real chart / real photo -> VOX restyle) — NEVER AI-invented numbers/names/dates'
  - 'Multi-layer structure budgeted: L1 bg texture + L2 hero transparent cutout + L3 elements + L4 CSS decor (bg + cutout images counted in image budget)'
  success_criteria:
  - Schema-valid proposal_packet artifact
  - selected_concept includes duration, word_target, render_runtime
  - cost_estimate has itemized line_items
  - data_authenticity_plan present (real_data element list + sources + key data points)
  - approval.status is approved or approved_with_changes before proceeding
- name: script
  skill: pipelines/vox-paper-collage/script-director
  required_artifacts_in:
  - proposal_packet
  optional_artifacts_in:
  - brief
  produces:
  - script
  tools_available: []
  checkpoint_required: true
  human_approval_default: true
  review_focus:
  - Fern DNA rules enforced (continuous narration only, no chapter labels, no camera directions)
  - 'BILINGUAL (2026-08): rules read from bilingual-spec by narration_language - cold open date format (section 4), transition words (section 5), hedging attribution templates for disputed facts (section 6: The FBI believed / 警方认为), cliffhanger final line en 12 words or fewer / zh 15 chars or fewer (section 7), punctuation red line (section 8: en no em dash, zh avoid 破折号/省略号)'
  - Cold open within first 3-4 sentences (en 30-40 words / zh 40-60 chars, precise date, location, one small concrete action)
  - Word count within 5 percent of target (en at 2.5 wps / zh at 4.7 chars per second per bilingual-spec section 1)
  - Every sentence ends cleanly on a full stop and carries one self-contained idea
  - Real-tragedy restraint - no gore, no suffering close-ups, no mockery of victims
  - Mandatory cliffhanger ending, final line 12 words or fewer, one of the five patterns
  - Facts stay accurate - never invent names, dates, or numbers
  success_criteria:
  - Schema-valid script artifact
  - Total word count within 5 percent of proposal word_target
  - Script is one continuous narration block
  - Cliffhanger ending present
- name: scene_plan
  skill: pipelines/vox-paper-collage/scene-plan-director
  required_artifacts_in:
  - script
  optional_artifacts_in:
  - proposal_packet
  produces:
  - scene_plan
  tools_available: []
  checkpoint_required: true
  human_approval_default: true
  review_focus:
  - 'SEMANTIC SCENES (ADR-002 D7, 2026-10 口径统一): scene boundaries follow semantics - scene = script paragraph_label section, beat = semantic unit within it; NOT voice-segment boundaries, NOT fixed 10s; total stays within target ±5%'
  - 'BEAT/CLIP HARD CAP (see bilingual-spec section 2, single source): every beat = one generated clip and must stay within the section 2 hard cap - video generation fails beyond it; split longer semantic units into consecutive beats at sentence boundaries'
  - 'TTS CALIBRATION (two-pass): scene_plan v1 uses estimated timing per bilingual-spec section 1; assets runs TTS + whisper first, then calibrates vs scene_plan (<=5% update in place to tts_actual with boundaries unchanged; >5% rewind to script); edit only accepts timing_source: tts_actual'
  - Element list extracted from narration text keywords (2.4万亿, TOP2, 7%, 未来已来...)
  - 'Element sync (shared): every element carries sync_sentence + semantic_family; entrance = sentence timestamp + 0.2s, duration = sentence_len × 0.8'
  - Multi-grid reference image generated FIRST, user-confirmed, THEN individual elements split from it
  - Text decorations (stamps/labels/tape/pins) rendered as CSS, zero cost — never AI-generated (multi-element failure)
  - 'MULTI-LAYER STRUCTURE (2026-08): every scene designs 4 layers - L1 bg texture image (per-scene theme), L2 hero transparent cutout (largest, earliest 0.3s, content outline = shape), L3 elements (voice-synced), L4 CSS decor; every element declares layer field'
  - 'DATA AUTHENTICITY per element (2026-08): each element inherits data_class (real_data / real_content / creative / css); real_data elements lock data_source plus key data_points (e.g. K-line +7.01 pct 125.20 vs 117.00); hero and cutout images planned as transparent PNG (solid tan bg then PIL cutout)'
  - 'Beat lengths per bilingual-spec section 2 (single source of truth): regular beats use the default cadence, flash beats are exception-only, never exceed the hard cap; one visual idea per beat; cut at semantic completeness, not by word count'
  - 'Timecodes and word targets by narration_language (bilingual-spec section 1): zh about 4.7 chars/s, en about 2.5 wps, tolerance ±5%'
  - Beat count within the bilingual-spec section 2 snapshot ranges (QC)
  - Beat table shows beat number, timecode start, exact narration words covered
  success_criteria:
  - Schema-valid scene_plan artifact
  - Every beat maps to exact narration words and a timecode
  - Every element binds a narration sentence (sync_sentence) with semantic animation family
  - Every element declares layer (bg/hero/element/decor) and data_class
  - Every scene has a bg texture layer designed
  - Beat count within engine sanity range for the selected duration
  - Every beat duration satisfies the bilingual-spec section 2 cadence (default tier, flash exception, hard cap)
- name: assets
  skill: pipelines/vox-paper-collage/assets-director
  required_artifacts_in:
  - scene_plan
  - script
  optional_artifacts_in:
  - proposal_packet
  produces:
  - asset_manifest
  required_tools:
  - tts_selector
  - asset_library
  - comfyui_image
  optional_tools:
  - image_selector
  - pixabay_music
  - freesound_music
  tools_available:
  - tts_selector
  - asset_library
  - comfyui_image
  - image_selector
  - pixabay_music
  - freesound_music
  checkpoint_required: true
  human_approval_default: true
  review_focus:
  - 'TTS FIRST (2026-08): narration TTS + whisper timestamps run FIRST, then timing calibration vs scene_plan (≤5% update to tts_actual / >5% rewind to script), then asset library search, then multi-grid reference, then beat full collages, then independent elements'
  - 'TTS per-segment duration hard-checked (ffprobe): each segment <= its beat duration cap; over-length = trim text and regenerate, NEVER force-fit timecodes (overlap = broken audio)'
  - whisper word/sentence timestamps saved to assets/audio/timestamps_*.json for compose
  - 'ASSET LIBRARY (2026-08): asset_library search MUST run before any generation; hits reused with touch; external-source assets archived with add; AI-generated content NOT archived'
  - 'THREE-LAYER PRODUCTION (2026-08 方案3): multi-grid reference (user-confirmed) -> visual blueprint per beat (Qwen21-txt2img, position-driven by scene_plan box, Editorial Title mandatory) -> independent element PNGs (standalone Qwen21-txt2img, NOT extracted from collage — img2img extraction was unreliable)'
  - 'EDITORIAL TITLE (2026-08 Playbook): every beat full collage carries a mandatory 1-4 word magazine-cover headline integrated into composition, not optional'
  - 'NEGATIVE PROMPT (2026-08 Playbook): every image prompt includes playbook image_negative_prompt verbatim, never omitted'
  - 'IMAGE GENERATION (2026-10 用户确认：全面 Qwen): ALL image generation via local comfyui_image + Qwen-Image 2.1 workflows ONLY (Qwen21-txt2img.json for text2img, Qwen21-edit.json for single-ref edit/restyle; dual-ref spare: apps/vox-collage/template/comfyui/wf_edit.json). No other ComfyUI workflows, no cloud image services. image_selector used ONLY for real-photo search (search_image -> pixabay/pexels)'
  - 'QWEN WORKFLOW PARAMS: txt2img output_node=10 prompt=5 negative=6 seed=8 size=7; edit output_node=461 prompt=459:474 ref=470 <UPLOADED_IMAGE> seed=459:458 size=459:456; model stack qwen_image_2.1_int8_convrot + qwen3vl_8b_int8_convrot + qwen_image_2.1_vae_bf16'
  - 'REAL PHOTO CASCADE (2026-08 决策 C4): real_content elements sourced via user upload -> asset library -> Wikimedia -> image_selector search_image -> Bing/Google (reference only) -> user-approved stylized generation; restyle via Qwen21-edit'
  - 'MISSING PHOTOS (2026-08 决策 C7): real_content photos not found anywhere are collected in asset_manifest.missing_photos[] and submitted to user decision; NEVER silently pure-generate'
  - 'REAL-DATA elements via Qwen21-edit (2026-08): real_data = matplotlib real-data reference chart -> comfyui_image Qwen21-edit (reference_image_path) with SOLID FLAT TAN background constraint in prompt -> PIL cutout; NEVER AI-invented numbers/names/dates'
  - Text decorations (stamps/labels/tape/pins/headlines) rendered as CSS or from asset library decals, zero-cost
  - 'BILINGUAL image rules (bilingual-spec sections 9-10, 2026-10 Qwen): image prompt structure ALWAYS English with Chinese label text allowed inline, content-driven count with no per-image cap (Qwen renders CJK directly; ALL generated text must pass glyph QC; critical small text may fall back to CSS/PIL); scraps/tape carry explicit Chinese labels, short English words, or icons - never left unspecified; Recurring Subject Rule across beats'
  - Every image prompt = SCENE + Editorial Title + style_block.md verbatim + closer.md verbatim + negative prompt (template red line)
  - Narration via tts_selector (calm deadpan male, zh ~4.7 chars/s, en ~155 wpm, emo_vector calm locked, 20-25 second batches)
  - Music from pixabay_music or asset library; Paper ASMR SFX from freesound_music or asset library
  - Layer 3 skills read for every generation tool before writing prompts (recorded in layer3_skills_read)
  - Use selector tools - never call provider tools directly
  success_criteria:
  - Schema-valid asset_manifest artifact
  - asset_library search called for each asset category (recorded in manifest; search before generate)
  - Multi-grid reference image generated and user-confirmed before element splitting
  - One beat full collage per beat with Editorial Title, all files exist on disk
  - Independent element PNGs with alpha, standalone text2img with solid flat tan bg, Recurring Subject Rule matching blueprint wording (PIL-verified opaque ratio 10-50%)
  - One bg texture per scene + hero/element cutout PNGs with alpha (PIL-verified opaque ratio 10-50%)
  - "timing_calibration_ref present: status calibrated (deviation <=5%) or rewind_required recorded"
  - real_data elements traceable to data source (yfinance JSON / official docs) recorded in manifest
  - real_content elements traceable to real photo source or listed in missing_photos[]
  - Narration, music, and SFX assets present with provenance
  - layer3_skills_read list present and includes all tools used
- name: edit
  skill: pipelines/vox-paper-collage/edit-director
  required_artifacts_in:
  - scene_plan
  - asset_manifest
  optional_artifacts_in:
  - script
  produces:
  - edit_decisions
  tools_available: []
  checkpoint_required: true
  human_approval_default: false
  review_focus:
  - 'VOICE-LED CLIP DURATION (2026-08): each beat''s clip duration equals the voice-segment duration from scene_plan, not a fixed 10s; build-on phase occupies ~70% of the segment, living-paper phase occupies the final ~30%'
  - Camera strictly locked for the entire clip - no zoom, pan, tilt, rotation, orbit, cuts, transitions
  - Final frame of animation exactly matches the source image (FINAL RULE)
  - Element entrance order follows narrative order (background scraps, hero cutout, supporting cutouts, tape, typewriter strips, stamps, red string, marker)
  - Audio plan per clip (paper ASMR only in clips; no music or narration inside the clip - narration is mixed in compose, not embedded in the clip)
  - render_runtime in edit_decisions matches proposal (hyperframes)
  success_criteria:
  - Schema-valid edit_decisions artifact
  - Every beat has a clip decision whose duration matches scene_plan voice-segment length
  - Locked camera and exact-final-frame rules recorded per clip
- name: compose
  skill: pipelines/vox-paper-collage/compose-director
  required_artifacts_in:
  - edit_decisions
  - asset_manifest
  optional_artifacts_in:
  - scene_plan
  produces:
  - render_report
  - final_review
  required_tools:
  - video_compose
  optional_tools:
  - audio_mixer
  - video_stitch
  tools_available:
  - video_compose
  - audio_mixer
  - video_stitch
  checkpoint_required: true
  human_approval_default: false
  review_focus:
  - 'SENTENCE-SYNCED (2026-08): element entrance = sentence start + 0.2s; animation duration = sentence_len × 0.8 (breathing room); semantic family (drop/rise/shake/pop/slide/grow/pulse/slap/fade) per sentence'
  - NEVER dump all elements at scene start — each element appears when its narration sentence is spoken
  - Short sentences (<1s) merged into neighbors; long sentences (>3s) may split into 2 elements
  - 'Label size red line (vertical 1080x1920): headline >= 100px, stamp >= 64px, tstrip >= 38-44px'
  - HyperFrames renders MUST pass hyperframes lint and hyperframes validate before render
  - Narration, music, and paper ASMR mixed with narration prominent
  - Clip sequence matches scene_plan beat order
  - Duration within 5 percent of target
  - Final frame check per clip (matches source image)
  - Post-render self-review with keyframe extraction and visual inspection
  success_criteria:
  - Schema-valid render_report artifact
  - Output file exists and passes ffprobe validation
  - self_review_completed is true with per-clip quality notes
- name: publish
  skill: pipelines/vox-paper-collage/publish-director
  required_artifacts_in:
  - render_report
  - final_review
  optional_artifacts_in:
  - proposal_packet
  - script
  produces:
  - publish_log
  tools_available:
  - image_selector
  checkpoint_required: true
  human_approval_default: true
  review_focus:
  - 3 thumbnail prompts follow Thumbnail DNA (louder treatment, bigger type, hotter red, harder contrast, built to read at 200px wide)
  - 'BILINGUAL thumbnail text rules (bilingual-spec section 11): en max 2 elements x 3 words condensed ALL CAPS, money with cents; zh max 2 elements x 4-6 chars bold compact typeface, money in 万/亿 units; Chinese characters NEVER in image prompts - thumbnail text composited via CSS/post'
  - Real-person hero gets black censor bar across eyes; single emphasis device only (red circle / underline / stamp box / yellow highlight - pick one, no stacking)
  - Same newsprint collage world as the video
  success_criteria:
  - Schema-valid publish_log artifact
  - 3 thumbnail images generated per Thumbnail DNA
  - Export package contains video and thumbnail outputs
